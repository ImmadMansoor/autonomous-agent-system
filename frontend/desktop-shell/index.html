<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MenuMind</title>
    <style>
      :root {
        color: #083f38;
        background: #f6faf9;
        font-family: Inter, Segoe UI, system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      img {
        width: min(100%, 440px);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(0, 98, 82, 0.25);
      }

      a {
        color: #006f61;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./menumind-logo-cover.jpg" alt="MenuMind" />
      <h1>MenuMind</h1>
      <p>The desktop shell is opening the live MenuMind operations console.</p>
      <p><a href="https://menumind-nu.vercel.app">Open MenuMind Web</a></p>
    </main>
  </body>
</html>
