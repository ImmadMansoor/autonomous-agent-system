[package]
name = "menumind-desktop"
version = "0.1.0"
description = "MenuMind Cafe Operations desktop shell"
authors = ["MenuMind"]
edition = "2021"

[lib]
name = "menumind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
